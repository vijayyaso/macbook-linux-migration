# intel-undervolt configuration for MacBookPro11,4 (Crystal Well Haswell, 47W TDP).
#
# Two jobs here:
#   1. Undervolt the CPU and its cache by 50 mV  -> less heat for the same work.
#   2. Cap the long-term package power (PL1) at 37W instead of the stock 45W.
#
# See README.md in this directory for the measurements behind the 37W number.
# intel-undervolt owns RAPL on this machine; thermald must NOT also drive it
# (see thermal-cpu-cdev-order.xml here).

# Do not hook elogind triggers; the systemd units and the sleep hook shipped
# with the package already cover boot and resume.
enable no

# CPU Undervolting
# Usage: undervolt ${index} ${display_name} ${undervolt_value}
#
# -50 mV is stable on this chip after extended all-core load testing. If you
# copy this file to different hardware, start at -25 and work down: an unstable
# undervolt shows up as random freezes and hard lockups, not as a clean error.
undervolt 0 'CPU' -50
undervolt 1 'GPU' 0
undervolt 2 'CPU Cache' -50
undervolt 3 'System Agent' 0
undervolt 4 'Analog I/O' 0

# Power Limits Alteration
# Usage: power ${domain} ${short_power_value} ${long_power_value}
#        power ${domain} ${watts}/${time_window} ${watts}/${time_window}
#
# PL2 60W / 2ms  - short bursts, unchanged; the heatsink absorbs these fine.
# PL1 37W / 28s  - sustained ceiling. The stock 45W is more heat than this
#                  chassis can shed: it rode 92-100C with both fans pegged and
#                  repeatedly hit TjMax. 37W holds 82-83C flat with zero
#                  thermal throttling, for about 200 MHz of sustained clock.
power package 60/0.002 37/28

interval 5000

daemon undervolt:once
daemon power
daemon tjoffset
